<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Empresas - Blendibox</title>
  <meta name="description" content="Consulte dados de empresas por CNPJ — dados públicos da Receita Federal." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topo">
    <div class="wrap topo-conteudo">
      <a href="./" class="marca">
        <span class="marca-icone">🔎</span>
        <span class="marca-texto">Buscador de Empresas <strong>Blendibox</strong></span>
      </a>
    </div>
  </header>

  <main class="wrap">
    <section class="busca-hero">
      <h1>Consulte uma empresa pelo CNPJ</h1>
      <p class="sub">Dados públicos da Receita Federal (Dados Abertos CNPJ).</p>

      <form id="form-busca" class="busca-form" autocomplete="off">
        <input
          id="entrada-cnpj"
          class="busca-input"
          type="text"
          placeholder="Digite o CNPJ ou o nome da empresa"
          aria-label="CNPJ ou nome da empresa"
        />
        <button class="busca-btn" type="submit">Consultar</button>
      </form>
      <p id="msg-erro" class="msg-erro" hidden></p>
    </section>

    <section id="resultado" class="resultado" hidden></section>
  </main>

  <footer class="rodape">
    <div class="wrap">
      <p>
        Dados públicos da Receita Federal (Dados Abertos CNPJ).
        Informações de sócios são exibidas de forma parcial (LGPD).
      </p>
      <p class="rodape-marca">Buscador de Empresas — Blendibox</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
