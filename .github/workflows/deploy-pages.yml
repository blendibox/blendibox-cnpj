name: Deploy do site (GitHub Pages)

# Publica a pasta frontend/ no GitHub Pages a cada push na main.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys concorrentes; mantém o último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site (pasta frontend/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
