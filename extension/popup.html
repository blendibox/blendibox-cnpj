<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

    <span class="cab-icone">🔎</span>
    <span class="cab-txt">Busca de Empresa <strong>Blendibox</strong></span>

  <form id="form" autocomplete="off">
    <input id="entrada" type="text" placeholder="Digite o CNPJ" inputmode="numeric" />

  <p id="erro" class="erro" hidden></p>
  <div id="resultado"></div>

  <footer class="rodape">
    Dados públicos da Receita Federal ·
    <a href="https://buscadeempresa.blendibox.com.br" target="_blank" rel="noopener">abrir site</a>
  </footer>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
