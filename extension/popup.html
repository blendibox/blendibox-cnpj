<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="cab">
    <span class="cab-icone">🔎</span>
    <span class="cab-txt">Busca de Empresa <strong>Blendibox</strong></span>
    <a class="cab-site" href="https://buscadeempresa.blendibox.com.br" target="_blank" rel="noopener">site ↗</a>
  </header>

  <form id="form" autocomplete="off">
    <input id="entrada" type="text" placeholder="Digite o CNPJ" inputmode="numeric" />
    <button type="submit">Buscar</button>
  </form>

  <div id="conteudo">
    <p id="erro" class="erro" hidden></p>
    <div id="resultado"></div>
  </div>

  <!-- Rodapé fixo: espaço publicitário (feed próprio) -->
  <section id="ofertas" class="ofertas" hidden>
    <div class="ofertas-cab">
      <span class="ofertas-tit">Ofertas Blendibox</span>
      <span class="ofertas-tag">Patrocinado</span>
    </div>
    <div id="ofertas-track" class="ofertas-track"></div>
  </section>

  <script src="common.js"></script>
  <script src="popup.js"></script>
  <script src="ads-popup.js"></script>
</body>
</html>
